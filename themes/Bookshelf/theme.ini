[theme]
name = Bookshelf
author = RiftWii

[shape]
corners = 1
gloss = yes
# The HOME Menu as iOS 6 drew things (iBooks kept its books on a wooden shelf).
home_menu = ios6

[backdrop]
stripes = no

[colors]
# Text: dark brown ink, on paper and on the wood
ink = #33200F
ink_soft = #4F3520
ink_dim = #5E4127
clock = #3F2814
accent = #8E4A1C
accent_ink = #6E3510
text_on_accent = #FFF8EC
warn = #A8321E

# Paper panels and buttons
card = #FBF6EC
card_edge = #B89E7C
card_edge_strong = #9E8462
shadow = #2A16064D
glow = #E2A24E70
glyph = #4F3520

# Option chips and switches
chip_on = #F3DFC0
chip_off = #F5EEE1
chip_off_edge = #C2AA88
switch_off = #D5C6AE

# Background and bars
bar = #B88D5A
backdrop = #C9A06A
backdrop_stripe = #C9A06A
banner_stripe = #FFF4E014
# The games' own colours, half walnut: cloth bindings on the shelf
banner_tint = #8A5A2E73

# Lists and badges
divider = #E6DCCB
scroll_track = #E3D6C1
scroll_thumb = #A88B66
badge = #F5EEE1
shelf = #B9874F
shelf_edge = #8A5A2E

# Player pointers
pointer1 = #3B8FD6
pointer2 = #D64545
pointer3 = #3FA34D
pointer4 = #D9A21B
