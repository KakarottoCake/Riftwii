# A RiftWii menu theme. Copy this folder to sd:/riftwii/themes/ and pick
# it in RiftWii under Settings > Theme. Every value below is RiftWii's
# default: change the ones you want and delete the rest if you like.
# Colours are #RRGGBB, or #RRGGBBAA where AA is the opacity (00 to FF).

[theme]
name = My Theme
author = Your name

[shape]
# Corner roundness, 0 (square) to 2 (twice as round).
corners = 1
# A shine across the top of buttons and tiles: yes or no.
gloss = no
# Home's bottom bar: dip (sinks under the clock, as the Wii Menu's) or bump.
bar = dip
# The HOME Menu: wii (the Wii's own) or ios6 (glossy bars and linen).
home_menu = wii

[backdrop]
# Thin horizontal stripes across the backdrop: yes or no.
stripes = yes

[colors]
# titles and labels
ink = #2E2E36
# values, secondary text
ink_soft = #4A4A54
# hints, footers
ink_dim = #6A6A74
# Home's clock
clock = #74747E
# highlights, outlines, the bar's curve
accent = #2FB6E9
# text in the accent's colour (switched-on values)
accent_ink = #0E6488
# text drawn on the accent colour
text_on_accent = #FFFFFF
# warnings, errors
warn = #B03A2E
# tiles, buttons, panels
card = #FFFFFF
# outline of tiles, buttons and panels
card_edge = #CFCFD6
# round buttons' rims
card_edge_strong = #C4C4CE
# shadow under tiles and buttons
shadow = #28283C22
# glow around the highlighted part
glow = #2FB6E950
# icons and arrows
glyph = #55555F
# an option's value box, changed from the default
chip_on = #E3F5FC
# an option's value box at its default
chip_off = #F4F4F6
# its outline
chip_off_edge = #D0D0D8
# an On/Off switch when off
switch_off = #D4D4DB
# Home's bottom bar, the banner screen's and the pages' title bands
bar = #DEDEE4
# behind every screen
backdrop = #ECECEF
# the backdrop's thin stripes
backdrop_stripe = #E3E3E8
# stripes over a game page's banner (before its box art is on the card)
banner_stripe = #FFFFFF14
# mixed into each game's colour and box art (banner, plain spines) by its alpha
banner_tint = #00000000
# between list rows
divider = #E8E8EE
# a list's scroll track
scroll_track = #E6E6EC
# a list's scroll thumb
scroll_thumb = #A8A8B4
# a tile's DISC/USB/SD label
badge = #ECECF1
# the top of Home's shelf
shelf = #F4F6F9
# the front edge of Home's shelf
shelf_edge = #D6DDE6
# outline of player 1's pointer hand
pointer1 = #3B8FD6
# outline of player 2's pointer hand
pointer2 = #D64545
# outline of player 3's pointer hand
pointer3 = #3FA34D
# outline of player 4's pointer hand
pointer4 = #D9A21B
