[theme]
name = Indigo
author = RiftWii contributors

[shape]
# Crisper corners than the default, as bevelled glass blocks.
corners = 0.6
gloss = yes
bar = dip
shelf_grain = no
home_menu = wii

[backdrop]
# background.png (a fine grid with a vignette) replaces the backdrop.
stripes = no

[colors]
# Text: white and pale lavender on the dark glass and the dark wall
ink = #F5F2FF
ink_soft = #D9D3F7
ink_dim = #A9A1D8
clock = #CFC8F4
# Gold marks what is focused
accent = #F5C431
accent_ink = #FFD966
text_on_accent = #2A1E04
warn = #FF7A7A

# Glass tiles, buttons and panels
card = #2C2463
card_edge = #7C72C8
card_edge_strong = #A39BE0
shadow = #00000088
glow = #F5C43170
glyph = #DCD6FA

# Option chips and switches
chip_on = #3E2F74
chip_off = #231C50
chip_off_edge = #554C98
switch_off = #3A3270

# Background and bars
bar = #2A2068
backdrop = #0C0919
backdrop_stripe = #0C0919
banner_stripe = #FFFFFF14
# The games' own colours, a little toward indigo
banner_tint = #1C145059

# Lists and badges
divider = #3C3478
scroll_track = #1C1742
scroll_thumb = #7068B8
badge = #3A3274
shelf = #2E2766
shelf_edge = #1C1746

# Player pointers
pointer1 = #3B8FD6
pointer2 = #E05252
pointer3 = #48B858
pointer4 = #E5AC24
