# This is an argument/return test, not an emulator. No BIOS or game needed.
format = 1
name = Argument test
system = Test
dol = boot.dol
games = sd:/roms/argv-test
extensions = test
args = -game {game} -preset {preset} -number {number} "name={game_name}" {game_folder}

[setting preset]
label = Preset
help = Checks that a value with spaces is one argument.
type = choice
values = auto, power stone
default = auto

[setting frameskip]
label = Frame skip
type = switch
on = -frameskip
default = off

[setting number]
label = Number
type = number
min = -2
max = 3
default = 0
